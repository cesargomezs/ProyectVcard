<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ProyectVcard/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>::QR Component con Backend::</title>

    <script src="https://unpkg.com/easyqrcodejs/dist/easy.qrcode.min.js"></script>
    <script src="https://kit.fontawesome.com/b512089a85.js" crossorigin="anonymous"></script>

    <style>
      .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
      .tab-btn { flex: 1; padding: 10px; border: 2px solid #cbd5e1; background: #f8fafc; cursor: pointer; font-weight: bold; border-radius: 6px; color: #475569; transition: 0.2s; }
      .tab-btn.active { background: #0f172a; color: white; border-color: #0f172a; }
      .form-section { display: none; }
      .form-section.active { display: block; }
      
      input[type="text"], input[type="email"], input[type="url"], input[type="tel"] {
        width: 100%; padding: 11px 14px; margin-top: 5px; margin-bottom: 15px;
        border: 2px solid #cbd5e1; border-radius: 8px; background-color: #ffffff;
        color: #0f172a; font-size: 14px; box-sizing: border-box; transition: 0.2s;
      }
      
      input[type="color"] {
        width: 100%;
        height: 45px;
        padding: 4px 8px;
        margin-top: 5px;
        margin-bottom: 10px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        background-color: #ffffff;
        cursor: pointer;
        box-sizing: border-box;
      }

      .color-palette {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
      }
      .color-swatch {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #cbd5e1;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
      }
      .color-swatch:hover {
        transform: scale(1.1);
        border-color: #0f172a;
      }
      .color-swatch.selected {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }

      input[type="text"]:focus, input[type="email"]:focus, input[type="url"]:focus, input[type="tel"]:focus, input[type="color"]:focus {
        border-color: #0f172a; outline: none; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
      }
      input[type="file"] { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 20px; border: 2px dashed #0f172a; border-radius: 8px; background-color: #f8fafc; color: #0f172a; font-size: 14px; cursor: pointer; box-sizing: border-box; }

      .phone-group { display: flex; align-items: stretch; margin-top: 5px; margin-bottom: 15px; }
      .phone-group select { padding: 11px 10px; border: 2px solid #cbd5e1; border-right: none; border-radius: 8px 0 0 8px; background-color: #f8fafc; color: #0f172a; font-size: 14px; outline: none; cursor: pointer; }
      .phone-group input[type="tel"] { margin: 0; border-radius: 0 8px 8px 0; flex: 1; }
      
      .btn, .btn-download {
        width: 100%;
        padding: 12px 14px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        box-sizing: border-box;
        cursor: pointer;
        border: none;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn.primary { background: #0f172a; color: white; }
      .btn.primary:hover { background: #1e293b; }
      .btn-download { background: #059669; color: white; display: none; }
      .btn-download:hover { background: #047857; }

      .card-preview-container {
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        border: 2px solid #e2e8f0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
    <link rel="stylesheet" crossorigin href="/ProyectVcard/assets/index-D6XEnuxR.css">
  </head>
  <body>
    <div class="divVcard">
      <img src="/ProyectVcard/assets/qrFake-Dwmz6K3g.jpg" class="imgQr" alt="Banner">
      <h1 style="text-align: center;">Generador QR Premium</h1>
      <p style="text-align: center; color: #64748b; font-size: 14px; margin-bottom: 30px;">
        Generador dinámico conectado al servidor en la nube. La foto se procesa en alta calidad.
      </p>

      <div class="divVcardForm">
        <div class="tab-container">
          <button type="button" class="tab-btn active" onclick="switchTab('vcard')"><i class="fa-solid fa-address-book"></i> vCard</button>
          <button type="button" class="tab-btn" onclick="switchTab('url')"><i class="fa-solid fa-link"></i> Web URL</button>
        </div>

        <p class="label" style="font-weight:bold; color:#0f172a;">Foto de Perfil (HD):</p>
        <input type="file" id="logoFile" accept="image/png, image/jpeg">

        <!-- FORMULARIO 1: vCard -->
        <form id="vcard-form" class="form-section active">
          <p class="label" style="font-weight:bold; color:#0f172a;">Color de Fondo de la Business Card:</p>
          
          <div class="color-palette">
            <div class="color-swatch selected" style="background-color: #b48a73;" onclick="setCardColor('#b48a73', this)" title="Terracota Elegante"></div>
            <div class="color-swatch" style="background-color: #0f172a;" onclick="setCardColor('#0f172a', this)" title="Azul Oscuro Ejecutivo"></div>
            <div class="color-swatch" style="background-color: #1e3a8a;" onclick="setCardColor('#1e3a8a', this)" title="Azul Rey"></div>
            <div class="color-swatch" style="background-color: #065f46;" onclick="setCardColor('#065f46', this)" title="Verde Bosque"></div>
            <div class="color-swatch" style="background-color: #7c2d12;" onclick="setCardColor('#7c2d12', this)" title="Marrón Oscuro"></div>
            <div class="color-swatch" style="background-color: #ffffff;" onclick="setCardColor('#ffffff', this)" title="Blanco Clásico"></div>
          </div>

          <input type="color" id="cardBgColor" value="#b48a73">

          <p class="label">Name:</p>
          <input type="text" id="name" placeholder="Ej. Cesar *****" required>
          
          <p class="label">Organization:</p>
          <input type="text" id="org" placeholder="Ej. Viviendo en USA">
          
          <p class="label">Phone:</p>
          <div class="phone-group">
            <select id="countryCode">
              <option value="+1">🇺🇸 +1</option>
              <option value="+52">🇲🇽 +52</option>
              <option value="+57">🇨🇴 +57</option>
              <option value="+34">🇪🇸 +34</option>
            </select>
            <input type="tel" id="phone" placeholder="Ej. 951****">
          </div>

          <p class="label">Email:</p>
          <input type="email" id="email" placeholder="Ej. *****@viviendoenusa.app">
          
          <p class="label">Address:</p>
          <input type="text" id="address" placeholder="Ej. Rancho Cucamonga, California">
          
          <p class="label">Web site or Url:</p>
          <input type="text" id="url" placeholder="Ej. https://viviendoenusa.app">
          
          <button type="submit" class="btn primary" id="btn-vcard"><i class="fa-solid fa-qrcode"></i> Generar QR Completo</button>
        </form>

        <!-- FORMULARIO 2: Enlace Web -->
        <form id="url-form" class="form-section">
          <p class="label">Target URL:</p>
          <input type="url" id="target-url" placeholder="Ej. https://viviendoenusa.app" required>
          <button type="submit" class="btn primary"><i class="fa-solid fa-qrcode"></i> Generar QR URL</button>
        </form>

        <!-- Contenedor del QR -->
        <div id="cardPreview" class="card-preview-container" style="display: none;">
          <div id="qrcode" class="qrCode"></div>
          <button type="button" id="btn-download" class="btn-download" onclick="downloadQRImage()">
            <i class="fa-solid fa-download"></i> Descargar Código QR (WebP HD)
          </button>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        function setCardColor(hexColor, element) {
            document.getElementById("cardBgColor").value = hexColor;
            document.querySelectorAll(".color-swatch").forEach(el => el.classList.remove("selected"));
            element.classList.add("selected");
        }

        function switchTab(tab) {
          document.getElementById("vcard-form").classList.toggle("active", tab === 'vcard');
          document.getElementById("url-form").classList.toggle("active", tab === 'url');
          document.querySelectorAll(".tab-btn")[0].classList.toggle("active", tab === 'vcard');
          document.querySelectorAll(".tab-btn")[1].classList.toggle("active", tab === 'url');
          document.getElementById("qrcode").innerHTML = "";
          document.getElementById("cardPreview").style.display = "none";
        }

        function getBase64Image(file) {
          if (!file) return Promise.resolve(null);
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(event) {
              const img = new Image();
              img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 200; 
                canvas.height = 200; 
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 200, 200);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                resolve({ base64: base64, dataUrl: event.target.result });
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          });
        }

        function renderQR(textData, logoVisual) {
          // GUARDAMOS LOS DATOS AQUÍ PARA QUE LA DESCARGA HD PUEDA USARLOS
          window.lastQrTextData = textData;
          window.lastLogoVisual = logoVisual;

          const container = document.getElementById("qrcode");
          container.innerHTML = "";

          // Renderizado normal en pantalla (260x260)
          new QRCode(container, {
            text: textData,
            width: 260,
            height: 260,
            colorDark: "#0f172a",      
            colorLight: "#ffffff", 
            correctLevel: QRCode.CorrectLevel.H, 
            dotScale: 0.85,             
            po: '#0f172a',             
            pi: '#2563eb',             
            logo: logoVisual || "",
            logoWidth: 65,
            logoHeight: 65,
            logoBackgroundTransparent: true
          });

          document.getElementById("cardPreview").style.display = "flex";
          document.getElementById("btn-download").style.display = "flex";
        }

        // Descarga en Alta Definición real (1000x1000 px) generando el QR nativamente desde cero
        function downloadQRImage() {
          if (!window.lastQrTextData) {
            alert("Primero debes generar el código QR.");
            return;
          }

          // Creamos un canvas temporal invisible a gran resolución (1000x1000 px)
          const hdContainer = document.createElement("div");
          hdContainer.style.display = "none";
          document.body.appendChild(hdContainer);

          // Generamos el QR de forma nativa a alta resolución para evitar cualquier pixelación
          new QRCode(hdContainer, {
            text: window.lastQrTextData,
            width: 1000,
            height: 1000,
            colorDark: "#0f172a",      
            colorLight: "#ffffff", 
            correctLevel: QRCode.CorrectLevel.H, 
            dotScale: 0.85,             
            po: '#0f172a',             
            pi: '#2563eb',             
            logo: window.lastLogoVisual || "",
            logoWidth: 220, 
            logoHeight: 220,
            logoBackgroundTransparent: true
          });

          // Damos un breve respiro para que el DOM renderice el canvas interno y lo exportamos en WebP HD
          setTimeout(() => {
            const hdCanvas = hdContainer.querySelector("canvas");
            if (hdCanvas) {
              const imageURL = hdCanvas.toDataURL("image/webp", 0.95);
              const link = document.createElement("a");
              link.href = imageURL;
              link.download = `QR_BusinessCard_UltraHD_${Date.now()}.webp`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            } else {
              alert("Error al generar la imagen en alta definición.");
            }
            document.body.removeChild(hdContainer);
          }, 200);
        }

        document.getElementById("vcard-form").addEventListener("submit", async function(e) {
          e.preventDefault();
          const btn = document.getElementById("btn-vcard");
          const originalText = btn.innerHTML;
          btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Conectando al Servidor...`;
          btn.disabled = true;

          try {
            const name = document.getElementById("name").value.trim();
            const org = document.getElementById("org").value.trim();
            const email = document.getElementById("email").value.trim();
            const address = document.getElementById("address").value.trim();
            const url = document.getElementById("url").value.trim();
            
            // Capturamos el color para mandarlo en el payload
            const cardColor = document.getElementById("cardBgColor").value;
            
            const phoneRaw = document.getElementById("phone").value.trim();
            const countryCode = document.getElementById("countryCode").value;
            const fullPhone = phoneRaw ? `${countryCode} ${phoneRaw}` : "";
            
            const fileInput = document.getElementById("logoFile");
            const imageData = await getBase64Image(fileInput.files[0]);

            const payload = {
                name: name,
                org: org,
                phone: fullPhone,
                email: email,
                address: address,
                url: url,
                cardColor: cardColor, // <-- Viaja al backend
                photoBase64: imageData ? imageData.base64 : null
            };

            const response = await fetch('https://generadorqr-api.onrender.com/api/generar-vcf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.success) {
                renderQR(data.fileUrl, imageData ? imageData.dataUrl : null);
            } else {
                alert("Error al generar el contacto en el servidor.");
            }
          } catch (error) {
            console.error(error);
            alert("No se pudo conectar con el servidor.");
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        });

        document.getElementById("url-form").addEventListener("submit", async function(e) {
          e.preventDefault();
          const targetUrl = document.getElementById("target-url").value.trim();
          const fileInput = document.getElementById("logoFile");
          const imageData = await getBase64Image(fileInput.files[0]);
          
          renderQR(targetUrl, imageData ? imageData.dataUrl : null);
        });
    </script>
  </body>
</html>
